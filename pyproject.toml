[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfe-study-cloud"
version = "1.0.0rc1"
description = "Open-source, cloud-hosted PDF study reader with structured AI analysis"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "MFE Study Cloud contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "openai>=1.68,<3",
  "pillow>=11.1,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.4,<7",
  "pypdfium2>=4.30,<5",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5.0,<6",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "twine>=6.1,<8",
  "types-boto3[s3]>=1.35,<2",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
mfe-study-cloud = "mfe_study_cloud.cli:main"
mfe-study-worker = "mfe_study_cloud.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mfe_study_cloud = [
  "py.typed",
  "schemas/*.json",
  "web/static/*",
  "web/templates/*.html",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=mfe_study_cloud --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mfe_study_cloud"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]
