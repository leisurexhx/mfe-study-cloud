name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    env:
      MFE_ANALYSIS_PROVIDER: fake
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python scripts/privacy_scan.py --history
      - run: python -m bandit -q -r src -c pyproject.toml
      - run: python -m pip_audit --skip-editable
      - run: python -m build
      - run: python -m twine check dist/*

  containers:
    runs-on: ubuntu-latest
    env:
      MFE_ANALYSIS_PROVIDER: fake
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
      - name: Wait for the web service
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Verify worker and fake-provider journey
        run: |
          docker compose ps --status running --services | grep --line-regexp worker
          docker compose run --rm --no-deps \
            --volume "$PWD/scripts/compose_smoke.py:/smoke.py:ro" \
            --env MFE_SMOKE_BASE_URL=http://web:8080 \
            web python /smoke.py
      - if: always()
        run: docker compose down --volumes
